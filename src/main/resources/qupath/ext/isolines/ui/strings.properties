title = Isolines extension

# Used by IsolinesExtension
name = Isolines extension
description = Generate colour-coded vector isoline annotations from a density map.
menu.enable = Enable Isolines extension
menu.description = Click this button to enable the Isolines extension
stage.title = Generate isolines
error = Isolines extension error
error.gui-loading-failed = GUI loading failed
error.no-script-editor = No script editor is available in this QuPath instance

# Heatmap (density map) selection
heatmap.label = Heatmap:
heatmap.tooltip = The density map (heatmap) JSON file to generate isolines from.
heatmap.prompt = No heatmap selected
heatmap.browse.button = Browse\u2026
heatmap.browse.tooltip = Choose a density map JSON file (as saved from the 'Load density map' dialog, or via a density map builder script).
heatmap.browse.title = Choose density map
heatmap.filter.description = Density map (*.json)

# Channel / levels
channel.label = Channel:
channel.tooltip = Which channel of the density map to threshold. Only shown when the loaded density map has more than one (e.g. a multi-criterion 'percent' map) -- a single-channel map has nothing to choose, so channel 0 is used automatically.
levels.label = Levels:
levels.tooltip = Number of evenly-spaced isoline levels to generate across the density map's display range.

# Clear existing
clear.checkbox = Clear existing isolines
clear.tooltip = Remove all annotations previously classified as an isoline (class name starting 'Isoline ') before generating new ones.

# Mask by class
mask.checkbox = Mask isolines outside selected class
mask.tooltip = Restrict isoline generation to annotations of the selected classification (e.g. a tissue region), instead of the whole image.
mask.combo.prompt = Select class\u2026

# Simplify contours
simplify.checkbox = Simplify contours
simplify.tooltip = Smooth each isoline's geometry with a topology-preserving simplifier immediately after it's created, at the given tolerance (in pixels). Reduces jaggedness from raw pixel-boundary tracing; doesn't remove small islands or holes.

# Buttons
generate.button = Generate isolines
generate.tooltip = Generate isoline annotations now, on the current image, using the settings above.
generatecode.button = Generate code
generatecode.tooltip = Create a Groovy script reproducing these settings and open it as a new, unsaved script.

# Notifications
generate.title = Generate isolines
generate.success = Isolines generated
generate.noimage = No image is currently open
generate.noheatmap = Please choose a heatmap (density map) JSON file first
generatecode.title = Generate isolines code
script.name = Isolines script
